<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Register</title>
    <link rel="stylesheet" href="css/ca-register.css">
</head>

<body>

    <div class="container">
            <a href="index.html">← Back to Home</a>
        <div class="panel">

            <img src="assets/images/logo.png" alt="EzyTax Logo" class="register-logo">

            <h2>
                Register as CA to join with EzyTax !
            </h2>

            <form action="#" method="post" enctype="multipart/form-data">

                <div class="form-section">
                    <h3>Personal Details</h3>
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="phone" placeholder="Phone Number" required>
                </div>

                <div class="form-section">
                    <h3>Set Password</h3>
                    <input type="password" name="password" placeholder="Password" required>
                    <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
                </div>

                <div class="form-section">
                    <h3>Professional Details</h3>
                    <input type="number" name="experience" placeholder="Years of Experience" required>
                    <input type="text" name="job_role" placeholder="Job Role" required>
                    <input type="text" name="degree" placeholder="Highest Degree" required>
                </div>

                <div class="form-section">
                    <h3>Documents</h3>

                    <label for="resume">Upload Resume</label>
                    <input type="file" id="resume" name="resume" required>

                    <label for="identity_proof">Proof of Identity</label>
                    <input type="file" id="identity_proof" name="identity_proof" required>
                </div>

                <button type="submit">Register</button>

            </form>

            <a href="login.html">Already have an account? Login</a>

        </div>

    </div>
    <!-- ================= FOOTER ================= -->
    <footer class="ezy-tax-footer">
        <div style="display:flex; padding: 0px 50px 0px 50px;">
            <img class="ezy-tax-symbol" src="assets/images/copyright-white.png" alt="copyright">
            <span class="ezy-tax-footer-text">2026 EzyTax Solutions Inc.</span>
            <div style="margin-left:auto; display:flex;">
                <img class="ezy-tax-symbol" src="assets/images/mail-icon-white.png" alt="mail">
                <a class="ezy-tax-footer-text" style="padding-right:10px;"
                    href="mailto:support@ezytax.com">support@ezytax.com</a>
                <img class="ezy-tax-symbol" src="assets/images/telephone-white.png" alt="phone">
                <a class="ezy-tax-footer-text" href="tel:+919999999999">+91 9999999999</a>
            </div>
        </div>
    </footer>
</body>

</html>
