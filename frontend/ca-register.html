<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA Register</title>
    <link rel="stylesheet" href="css/caRegister.css">
</head>
<body>
    <header class="navbar">

        <img src="assets/images/logo.png"
             alt="EzyTax Logo"
             class="ezy-tax-logo">

        <nav>
            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="caIndex.html">Profile</a></li>
                <li>
                    <a href="login.html" class="navbar-login-link">
                    Login/signup
                    </a>
                </li>
            </ul>
        </nav>

    </header>


<div class="container">

   <div class="top-panel">
    <!-- <img src="C:\Users\vedas\OneDrive\Desktop\F_End Project\EzyTax\frontend\assets\images\logo.png" 
    class="logo" alt="Logo" height="200 px" width="200px"> -->

    <h1 >Welcome!</h1>
    <p style="font-size: 30px;">Create your account and start your journey with us.</p>

</div>

    <div class="right-panel">
        <h2 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', 
        sans-serif; font-size: 50px;">Register CA</h2>
            <div class="form-section">
                <h3>Personal Details</h3>
                <input type="text" name="name" placeholder="Full Name" required>
                <input type="text" name="email" placeholder="Email" required>
                <input type="text" name="phone" placeholder="Phone Number" required>
            </div>

            <div class="form-section">
                <h3>Security</h3>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <div class="form-section">
                <h3>Professional Details</h3>
                <input type="number" name="experience" placeholder="Years of Experience" required>
                <input type="text" name="job_role" placeholder="Job Role" required>
                <input type="text" name="degree" placeholder="Highest Degree" required>
            </div>

            <div class="form-section">
                <h3>Documents</h3>
                <label>Upload Resume</label>
                <input type="file" name="resume" required>

                <label>Proof of Identity</label>
                <input type="file" name="identity_proof" required>
            </div>

            <button type="submit">Register</button>

        </form>

        <a href="login.html">Already have an account? Login</a>
    </div>

</div>
</body>
</html>
