<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Ezy Tax">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <img src="assets/images/logo.png" class="ezy-tax-logo" alt="Logo">
        <h1 class="ezy-tax-heading-one">Login</h1>
        <h2 class="ezy-tax-heading-two">To fulfill all your tax needs in one place</h2>
        <form action="submit" method="POST">
            <div>
                <label class="ezy-tax-form-label" for="email-or-phone">Email or Phone Number</label>
                <input type="text" id="email-or-phone" name="email-or-phone" required>
            </div>
            <div>
                <label class="ezy-tax-form-label" for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <a class="ezy-tax-word-link" href="forgot-password.html">Forgot Password?</a>
            <div>
                <input type="checkbox" id="logged-in" name="logged-in" value="logged-in">
                <label class="ezy-tax-form-label" for="logged-in">Keep me logged in</label>
            </div>
            <button class="ezy-tax-button">Login</button>
        </form>
        <hr class="ezy-tax-form-separator">
        <span>New to Ezy Tax?</span>
        <a class="ezy-tax-word-link" href="signup.html">Click here to sign up and get started!</a>
        <footer>
            <div>
                <span>EzyTax All Rights Reserved</span>
                <img src="assets/images/copyright.png" alt="copyright">
                <span>2026 EzyTax Solutions Inc.</span>
            </div>
            <div>
                <img src="assets/images/mail-icon.png" alt="mail">
                <a href="mailto:support@ezytax.com">support@ezytax.com</a>
                <img src="assets/images/telephone.png" alt="phone">
                <a href="tel:+919999999999">+91 9999999999</a>
            </div>
        </footer>
    </body>
</html>
