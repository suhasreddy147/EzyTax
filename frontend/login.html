<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Ezy Tax">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="ezy-tax-form-border">
            <img src="assets/images/logo.png" class="ezy-tax-logo" alt="Logo">
            <h1 class="ezy-tax-heading-one">Login</h1>
            <h2 class="ezy-tax-heading-two">To fulfill all your tax needs in one place</h2>
            <form action="submit" method="POST">
                <div id="ezy-tax-div" class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="email-or-phone">Email or Phone Number</label>
                    <input class="ezy-tax-textbox" type="text" id="email-or-phone" name="email-or-phone" placeholder="Enter your email or phone number" required>
                </div>
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="password">Password</label>
                    <input class="ezy-tax-textbox" type="password" id="password" placeholder="Enter your password" name="password" required>
                </div>
                <div class="ezy-tax-form-div" style="margin-bottom: 20px;">
                    <input class="ezy-tax-checkbox" type="checkbox" id="logged-in" name="logged-in" value="logged-in">
                    <label class="ezy-tax-checkbox-label" for="logged-in">Keep me logged in</label>
                    <a class="ezy-tax-word-link" style="margin-left: 10px;" href="forgot-password.html">Forgot Password?</a>
                </div>
                <button class="ezy-tax-button">Login</button>
            </form>
            <div class="ezy-tax-form-separator"></div>
            <div class="ezy-tax-form-div" style="margin-bottom: 80px;">
                <span class="ezy-tax-form-text" style="margin-left: 60px;">New to Ezy Tax?</span>
                <a class="ezy-tax-word-link" href="signup.html">Click here to sign up and get started!</a>
            </div>
        </div>
            <footer class = "ezy-tax-footer">
                <div style="display:flex; padding: 0px 50px 0px 50px;">
                    <img class="ezy-tax-symbol" src="assets/images/copyright-white.png" alt="copyright">
                    <span class="ezy-tax-footer-text">2026 EzyTax Solutions Inc.</span>
                    <div style="margin-left:auto; display:flex;">
                        <img class="ezy-tax-symbol" src="assets/images/mail-icon-white.png" alt="mail">
                        <a class="ezy-tax-footer-text" style="padding-right:10px;" href="mailto:support@ezytax.com">support@ezytax.com</a>
                        <img class="ezy-tax-symbol" src="assets/images/telephone-white.png" alt="phone">
                        <a class="ezy-tax-footer-text" href="tel:+919999999999">+91 9999999999</a>
                    </div>
                </div>
            </footer>
    </body>
</html>
