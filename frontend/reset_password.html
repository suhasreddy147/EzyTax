<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Ezy Tax">
        <link rel="stylesheet" href="css/styles.css">
        <title>EzyTax Reset Password</title>
    </head>
    <body>
        <div class="ezy-tax-form-border">
            <img src="assets/images/logo.png" class="ezy-tax-logo" alt="Logo">
            <h1 class="ezy-tax-heading-one">Reset Password</h1>
            <form action="submit" method="POST">
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="new-password">New Password</label>
                    <input class="ezy-tax-textbox" type="password" id="new-password" placeholder="Enter your new password" name="new-password" required>
                </div>
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="confirm-password">Email or Phone Number</label>
                    <input class="ezy-tax-textbox" type="password" id="confirm-password" placeholder="Re-enter your password" name="confirm-password" required>
                </div>
                <button class="ezy-tax-button">Reset</button>
            </form>
            <div class="ezy-tax-form-separator"></div>
            <div class="ezy-tax-form-div" style="margin-bottom: 80px;">
                <span class="ezy-tax-form-text" style="margin-left: 120px;">Done?</span>
                <a class="ezy-tax-word-link" href="login.html">Click here to get back to login!</a>
            </div>
        </div>
            <footer class = "ezy-tax-footer">
                <div style="display:flex; padding: 0px 50px 0px 50px;">
                    <img class="ezy-tax-symbol" src="assets/images/copyright-white.png" alt="copyright">
                    <span class="ezy-tax-footer-text">2026 EzyTax Solutions Inc.</span>
                    <div style="margin-left:auto; display:flex;">
                        <img class="ezy-tax-symbol" src="assets/images/mail-icon-white.png" alt="mail">
                        <a class="ezy-tax-footer-text" style="padding-right:10px;" href="mailto:support@ezytax.com">support@ezytax.com</a>
                        <img class="ezy-tax-symbol" src="assets/images/telephone-white.png" alt="phone">
                        <a class="ezy-tax-footer-text" href="tel:+919999999999">+91 9999999999</a>
                    </div>
                </div>
            </footer>
    </body>
</html>
