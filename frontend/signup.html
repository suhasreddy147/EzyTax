<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Ezy Tax">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="ezy-tax-form-border" style="margin-bottom: 100px;">
            <img src="assets/images/logo.png" class="ezy-tax-logo" alt="Logo">
            <h1 class="ezy-tax-heading-one">Sign Up</h1>
            <h2 class="ezy-tax-heading-two">To start your tax consulting journey</h2>
            <form action="submit" method="POST">
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="email-or-phone">Email or Phone Number</label>
                    <input class="ezy-tax-textbox" type="text" id="email-or-phone" placeholder="Enter your email or phone number" name="email-or-phone" required>
                </div>
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="password">Password</label>
                    <input class="ezy-tax-textbox" type="password" placeholder="Enter your password" id="password" name="password" required>
                </div>
                <div class="ezy-tax-form-div">
                    <label class="ezy-tax-textbox-label" for="confirm-password">Confirm Password</label>
                    <input class="ezy-tax-textbox" type="password" placeholder="Re-Enter your password" id="confirm-password" name="confirm-password" required>
                </div>
                <button class="ezy-tax-button">Sign Up</button>
            </form>
            <div class="ezy-tax-form-separator"></div>
            <div class="ezy-tax-form-div" style="margin-bottom: 80px;">
                <span class="ezy-tax-form-text" style="margin-left: 100px;">Ready?</span>
                <a class="ezy-tax-word-link" href="login.html">Click here to login and get started!</a>
            </div>
        </div>
    <!-- ================= FOOTER ================= -->

    <footer class = "ezy-tax-footer">
        <div style="display:flex; padding: 0px 50px 0px 50px;">
            <img class="ezy-tax-symbol" src="assets/images/copyright-white.png" alt="copyright">
                <span class="ezy-tax-footer-text">2026 EzyTax Solutions Inc.</span>
                    <div style="margin-left:auto; display:flex;">
                        <img class="ezy-tax-symbol" src="assets/images/mail-icon-white.png" alt="mail">
                        <a class="ezy-tax-footer-text" style="padding-right:10px;" href="mailto:support@ezytax.com">support@ezytax.com</a>
                        <img class="ezy-tax-symbol" src="assets/images/telephone-white.png" alt="phone">
                        <a class="ezy-tax-footer-text" href="tel:+919999999999">+91 9999999999</a>
                    </div>
        </div>
    </footer>
    </body>
</html>
