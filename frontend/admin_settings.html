
    <!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Admin Settings</title>

            <link rel="stylesheet" href="css/index.css">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
            <link rel="stylesheet" href="css/adminDash.css">
        </head>
        <body>
            <header class="navbar">
                <img src="assets/images/logo.png" alt="EzyTax Logo" class="ezy-tax-logo">

                <nav>
                    <ul class="nav-links">
                        <li><a href="admin_dashboard.html">Dashboard</a></li>
                        <li><a href="admin_accounts.html">Accounts</a></li>
                        <li><a href="admin_consultations.html">Consultations</a></li>
                        <li><a href="admin_transactions.html">Transactions</a></li>
                        <li><a href="admin_complaints.html">Complaints</a></li>
                        <li><a href="admin_settings.html">Settings</a></li>
                    </ul>
                </nav>
            </header>

            <section class="container-fluid mx-2 mt-4">
                <h1 class="mb-4">Settings Page</h1>

                <div class="row g-4">
                    <div class="col-lg-6">
                        <div class="dashboard-card">
                            <h2 class="mb-4">Admin Profile</h2>

                            <div class="mb-3 text-start">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" value="Admin User">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" value="admin@ezytax.com">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">Phone Number</label>
                                <input type="text" class="form-control" value="+91 9999999999">
                            </div>

                            <button class="btn btn-primary">Update Profile</button>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="dashboard-card">
                            <h2 class="mb-4">Platform Settings</h2>

                            <div class="mb-3 text-start">
                                <label class="form-label">Platform Commission (%)</label>
                                <input type="number" class="form-control" value="10">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">Minimum Consultation Fee</label>
                                <input type="number" class="form-control" value="99">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">Maximum Consultation Fee</label>
                                <input type="number" class="form-control" value="4999">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">GST Percentage</label>
                                <input type="number" class="form-control" value="18">
                            </div>

                            <button class="btn btn-primary">Save Changes</button>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mt-1">
                    <div class="col-lg-6">
                        <div class="dashboard-card">
                            <h2 class="mb-4">Notification Settings</h2>

                            <div class="form-check form-switch text-start mb-3">
                                <input class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label">Email Notifications</label>
                            </div>

                            <div class="form-check form-switch text-start mb-3">
                                <input class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label">Complaint Alerts</label>
                            </div>

                            <div class="form-check form-switch text-start mb-3">
                                <input class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label">Payment Notifications</label>
                            </div>

                            <div class="form-check form-switch text-start">
                                <input class="form-check-input" type="checkbox" checked>
                                <label class="form-check-label">New CA Registration Alerts</label>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="dashboard-card">
                            <h2 class="mb-4">Security Settings</h2>

                            <div class="mb-3 text-start">
                                <label class="form-label">Current Password</label>
                                <input type="password" class="form-control">
                            </div>

                            <div class="mb-3 text-start">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control">
                            </div>

                            <div class="mb-4 text-start">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control">
                            </div>

                            <button class="btn btn-primary">Change Password</button>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12">
                        <div class="dashboard-card border border-danger">
                            <h2 class="text-danger mb-4">Danger Zone</h2>

                            <div class="d-flex justify-content-center gap-3 flex-wrap">
                                <button class="btn btn-warning">Logout From All Devices</button>
                                <button class="btn btn-danger">Deactivate Account</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ================= FOOTER ================= -->
            <footer class="ezy-tax-footer">
                <div style="display:flex; padding:0 50px;">
                    <img class="ezy-tax-symbol" src="assets/images/copyright-white.png" alt="copyright">
                    <span class="ezy-tax-footer-text">2026 EzyTax Solutions Inc.</span>

                    <div style="margin-left:auto; display:flex;">
                        <img class="ezy-tax-symbol" src="assets/images/mail-icon-white.png" alt="mail">

                        <a class="ezy-tax-footer-text" style="padding-right:10px;" href="mailto:support@ezytax.com">support@ezytax.com</a>

                            <img class="ezy-tax-symbol" src="assets/images/telephone-white.png" alt="phone">

                        <a class="ezy-tax-footer-text" href="tel:+919999999999">+91 9999999999</a>
                    </div>
                </div>
            </footer>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        </body>
    </html>
